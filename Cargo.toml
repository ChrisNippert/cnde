[workspace]
resolver = "3"
members = ["compositor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Smithay and the renderer are painfully slow unoptimized; keep our own code debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
