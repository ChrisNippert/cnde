[package]
name = "cnde-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
bitflags = "2"
xcursor = "0.3"
cnde-config = { path = "../config" }
cnde-ipc = { path = "../ipc" }
# inotify for config hot-reload (same major version smithay uses).
rustix = { version = "1", features = ["fs"] }
# Connector scanning for monitor hotplug. Its EDID (`display-info`) feature
# wants an older libdisplay-info than Arch ships, so it's off for now.
smithay-drm-extras = { version = "0.1", default-features = false }
# Wallpaper decoding and scaling (pure Rust codecs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
]
