[package]
name = "cnde-files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cnde-files"
path = "src/main.rs"

[dependencies]
cnde-ui = { path = "../ui" }
cnde-config = { path = "../config" }
cnde-ipc = { path = "../ipc" }
tracing.workspace = true
tracing-subscriber.workspace = true
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
# inotify for following hand edits of the config.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# Preview PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
