[package]
name = "cnde-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cnde-ui = { path = "../ui" }
cnde-config = { path = "../config" }
cnde-ipc = { path = "../ipc" }
tracing.workspace = true
tracing-subscriber.workspace = true
# xkbcommon: key names (Escape closes quick settings).
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# inotify for live config reload (same major version smithay uses).
rustix = { version = "1", features = ["fs", "process"] }
# System services (UPower, NetworkManager, iwd).
zbus = "5"
# The polkit agent waits for its dialog (already in the tree via zbus).
async-channel = "2"
