[package]
name = "cnde-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cnde-apps = { path = "../apps" }
cnde-ui = { path = "../ui" }
cnde-config = { path = "../config" }
cnde-ipc = { path = "../ipc" }
tracing.workspace = true
tracing-subscriber.workspace = true
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
# inotify for following hand edits of the config.
rustix = { version = "1", features = ["fs"] }
# Wallpaper thumbnails; the same formats the compositor can show.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Wi-Fi through NetworkManager or iwd.
zbus = "5"
serde = "1"
