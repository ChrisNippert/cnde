# xdg-desktop-portal-wlr settings for cnde (written to
# $XDG_CONFIG_HOME/xdg-desktop-portal-wlr/cnde when you have none of your
# own; cnde rewrites it only while it's unchanged, e.g. when the picker moves).
#
# When an app asks to share the screen, cnde-share-picker shows a card per
# monitor. Set `share_picker = "keep"` in [portal] of cnde's config.toml to
# stop cnde managing this file.
[screencast]
chooser_type=simple
chooser_cmd=@CHOOSER@
max_fps=60
