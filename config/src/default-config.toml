# cnde configuration. Changes apply as soon as you save.
# If something is wrong (a typo, a value out of range), the last working
# config stays in effect and the error is logged.
#
# Everything is commented out: these are the defaults. Uncomment to change.

[input.keyboard]
# layout = "us"            # e.g. "us,de"; empty uses XKB_DEFAULT_LAYOUT
# variant = ""
# options = ""             # e.g. "caps:escape"
# repeat_delay = 200       # ms before a held key repeats
# repeat_rate = 25         # repeats per second
# natural_workspace_keys = false   # true: Super+Alt+Left shows the next workspace (content moves left)

[input.mouse]
# speed = 0.0              # -1.0 (slow) to 1.0 (fast)
# accel_profile = "adaptive"   # or "flat"
# natural_scroll = false

[input.touchpad]
# speed = 0.0
# accel_profile = "adaptive"
# natural_scroll = true
# tap_to_click = true
# tap_and_drag = true
# disable_while_typing = true
# workspace_swipe_distance = 900   # 3-finger swipe travel per workspace; larger = slower

# Per-monitor settings. Names are logged when a monitor connects ("DP-2",
# "eDP-1", ...). Monitors without an entry are placed left to right.
#
# [[output]]
# name = "DP-2"
# position = { x = 0, y = 0 }
# scale = 1.0
# mode = { width = 2560, height = 1440, refresh = 180 }   # default: preferred size, fastest refresh
# main = true              # anchor for workspaces; default is the leftmost
# vrr = "fullscreen"       # FreeSync: "off" (default), "on", or "fullscreen" (games/videos only)

[appearance]
# color_scheme = "dark"    # or "light"; picks the wallpaper variant
# icon_theme = "cnde"      # "cnde", "Adwaita", or any installed icon theme (e.g. "Papirus")
# base_color = "#2b1a40"   # palette = "custom": surfaces take this colour's hue
# accent_color = "#f4a7c6" # palette = "custom": switches, selection, sliders; or "auto" (a shade of the wallpaper's hue)
# palette = "quiet"        # "quiet" (warm greys, amber), "cnde" (Dusk/Blossom), "adwaita" (GNOME's), "custom", or "adaptive" (like custom, from the wallpaper; dark or light still follows color_scheme; the bar and dock match windows against them)
# window_buttons = "all"   # "all" (minimize, maximize, close) or "close"
# titlebars = "cnde"       # "cnde" draws title bars for apps that allow it; "app" leaves them to the app
# material = "frosted"     # "frosted" or "solid": the top bar, dock, the shell's popups and cnde's own windows (solid when snapped, maximized or a window touches them)
# corner_radius = 10       # window corners in px (0-48); the dock, bar and menus scale with it

[dark_mode]
# Switch appearance.color_scheme by the time of day. Switching by hand
# (quick settings, Settings) lasts until the next scheduled switch.
# schedule = "off"         # "off" (by hand only), "sunset" (dark from sunset to sunrise), "custom"
# from = "19:00"           # "custom": dark from this time (24-hour)...
# to = "07:00"             # ...until this one; also used by "sunset" until [location] is set

[night_light]
# A warm colour filter (less blue light), applied by the compositor.
# schedule = "off"         # "off", "always", "sunset" (sunset to sunrise), "custom"
# temperature = 4000       # kelvin, 2500 (warmest) to 6500 (no change)
# from = "20:00"           # "custom": on from this time (24-hour)...
# to = "06:00"             # ...until this one; also used by "sunset" until [location] is set

[location]
# For sunset and sunrise, worked out on this computer: nothing is looked up online.
# coordinates = ""         # "latitude, longitude" in degrees, north and east positive, e.g. "52.52, 13.40"

[power]
# What to do when nothing is typed or clicked, with separate times on battery
# and plugged in (desktops use the plugged-in ones). Seconds; 0 skips a step.
# Video players and browsers playing video keep the computer awake. Suspending
# locks first if [lock] has a command.
# lock_on_screen_off = true    # lock when the monitors turn off
# lock_before_suspend = true   # lock before sleeping
# battery_percent = true       # show the charge as a number in the top bar
# low_battery = 15             # warn below this percent while discharging; 0 is off
# profile_command = ""         # switches the power mode when no power-profiles daemon runs; gets power-saver, balanced or performance added
# [power.battery]
# dim_after = 120          # fade the screen to half brightness
# screen_off_after = 300   # turn the monitors off
# suspend_after = 900      # sleep
# [power.ac]
# dim_after = 300
# screen_off_after = 600
# suspend_after = 0        # never

[wallpaper]
# light = ""               # image path (PNG, JPEG, WebP), e.g. "~/Pictures/day.jpg"
# dark = ""                # used in dark mode; empty uses `light` for both
# fit = "fill"             # "fill" (crop to cover), "fit" (whole image), "stretch"
# With no image set, a built-in gradient is drawn.

[animations]
# speed = 1.0              # 0.5 = twice as fast, 0.0 = no animations

[tiling]
# Super+T switches the current workspace between floating and tiling;
# Super+Enter swaps the focused window with the main one, Super+[ and
# Super+] narrow and widen the main window, Super+Shift+T floats one window.
# On a tiling workspace Super+arrows move focus between windows and
# Super+Shift+arrows swap the focused one with its neighbour (or move it to
# the next monitor). New windows split the focused one.
# layout = "floating"      # how workspaces start: "floating" or "tiling"
# style = "dwindle"        # "dwindle": each new window halves the last one (Hyprland's default); "master": main window left, the rest stacked right
# master_ratio = 0.5       # share of the width the first window takes (0.1-0.9)
# gap = 8                  # px between tiled windows (0-64)
# outer_gap = 8            # px between tiled windows and the screen's edges (0-128)

[panel]
# enabled = true           # false: hide the top bar (e.g. to use waybar via autostart)
# all_monitors = false     # true: a panel on every monitor, not just the main one
# tray = true              # show tray icons (Discord, Steam, Nextcloud...) in the bar
# height = 32
# rounded = false          # rounded bottom corners and a soft shadow
# frosted = true           # just the bar, overriding appearance.material
# mode = "auto"            # "attached" (flush with the top edge), "floating" (clear of the edges), "auto" (floats until a window touches it)
# clear = false            # floating with nothing touching it: no background, just text and icons
# background = ""          # "#rrggbb" or "#rrggbbaa" (translucent); empty follows the style
# foreground = ""
# font_size = 14
# clock_format = "%a %b %-d  %H:%M"   # e.g. "%I:%M %p" for 12-hour
# clock_position = "center"   # or "left", "right"
# workspace_dot_size = 7
# workspace_active_width = 28
# padding = 12             # space at the left and right ends
# button_padding = 10      # room either side of each button

[dock]
# position = "overview"    # "overview" (only there, like GNOME), "bottom", "left", "right", "off"
# visibility = "always"    # on an edge: "always" ("intellihide" and "autohide" are coming)
# all_monitors = false     # on an edge: a dock on every monitor, not only the main one
# favorites = ["firefox.desktop", "org.gnome.Nautilus.desktop", "Alacritty.desktop"]
# icon_size = 48
# padding = 8              # room either side of each icon
# launcher = "end"         # the app grid button: "start" (before the icons) or "end"
# launcher_gap = 12        # space between it and the icons
# background = "frosted"   # just the dock, overriding appearance.material: "solid" or "frosted"
# extend = false           # on an edge, while attached: stretch across the whole edge
# mode = "auto"            # on an edge: "attached", "floating", or "auto" (floats until a window touches it)
# align = "center"         # "start" (left/top), "center", "end" (right/bottom); stretched, moves the icons
# float_align = "center"   # while floating as a pill: same choices as align; unset, same as align
# reserve = true           # on an edge: maximized windows stop at it; false floats it over them
# adaptive_color = "bar"   # with palette = "adaptive": "bar" (the bar's colour) or "darker" (a darker shade of the window at the bottom edge, or the wallpaper)
# locked = false           # true: no dragging icons or the dock, and no edit mode
# system_monitor = "gnome-system-monitor"  # "System Monitor" in the dock's menu runs this; "" hides it

[launcher]
# Tapping Super opens the overview. Set a command to run that instead.
# command = ""             # e.g. "fuzzel"

[autostart]
# Run once at startup.
# commands = ["waybar"]
# The shell: top bar, dock, overview search, quick settings. Kept running
# and restarted if it crashes. "" runs none (e.g. with waybar above).
# shell = "cnde-shell"
# Start PipeWire (sound) when nothing else does, e.g. on Alpine without
# systemd. Skipped if PipeWire is already running.
# audio = true

[sound]
# Short sounds from the freedesktop sound theme (sound-theme-freedesktop):
# a click when the volume keys change it, a shutter for screenshots, low
# battery, and plugging the charger in or out. Played with pw-play or paplay.
# event_sounds = true

[notifications]
# The shell shows apps' notifications at the top right. Turn it off to use
# another notification daemon (mako, dunst); one already running wins anyway.
# enabled = true
# do_not_disturb = false     # only urgent ones show; quick settings toggles it

[lock]
# The program that locks the screen (Super+L). Any locker using the
# ext-session-lock protocol works, e.g. "swaylock" or "gtklock". If it
# crashes while locked, the screen stays locked and it's started again.
# command = "cnde-lock"

[files]
# Icon sizes in the file manager, in logical pixels. The menu next to the
# window buttons (and Ctrl+scroll, Ctrl+plus/minus) changes them.
# grid_icon_size = 48        # 48 to 192
# list_icon_size = 18        # 16 to 48

[apps]
# Programs without a MIME type. Settings > Default Apps changes these (and
# the file associations in ~/.config/mimeapps.list).
# The terminal for Super+Q, "Open in Terminal" and terminal apps, as a
# desktop file ID. "" looks for $TERMINAL, then common terminals.
# terminal = "foot.desktop"

[shortcuts]
# Each action takes a combo or a list of them; "" or [] turns it off. Modifiers:
# Super (also Mod4, Logo), Alt, Ctrl, Shift; keys are xkb names (Q, Return,
# Left, bracketleft, F5...). Case doesn't matter. Nested in another desktop
# Super is Alt instead, and Super+Alt becomes Alt+Ctrl. A later binding wins
# a clash (logged). Fixed: Ctrl+Alt+Backspace quits, Ctrl+Alt+F1..F12 switch
# VT, the volume/brightness keys, and tapping Super (see [launcher]).
# terminal = "Super+Q"                      # open a terminal
# browser = "Super+F"                       # open the web browser
# files = "Super+E"                         # open the default file manager
# system_monitor = "Ctrl+Shift+Escape"      # open the system monitor (dock.system_monitor)
# close = ["Super+C", "Alt+F4"]             # close the window
# lock = "Super+L"                          # lock the screen
# app_grid = "Super+A"                      # show the app grid
# show_desktop = "Super+D"                  # minimize everything here; again brings them back
# screenshot = ["Super+Shift+S", "Print"]   # take a screenshot
# switcher = ["Alt+Tab", "Super+Tab"]       # switch windows
# switcher_back = ["Alt+Shift+Tab", "Super+Shift+Tab"]  # switch windows, backwards
# maximize = "Super+Up"                     # maximize (tiling: focus up)
# restore = "Super+Down"                    # restore (tiling: focus down)
# snap_left = "Super+Left"                  # snap left (tiling: focus left)
# snap_right = "Super+Right"                # snap right (tiling: focus right)
# fullscreen = "Super+Shift+F"              # toggle fullscreen
# toggle_tiling = "Super+T"                 # tile or float this workspace
# toggle_floating = "Super+Shift+T"         # float or tile the focused window
# swap_master = ["Super+Return", "Super+KP_Enter"]              # swap with the main tile
# master_wider = "Super+bracketright"       # widen the main tile
# master_narrower = "Super+bracketleft"     # narrow the main tile
# move_tile_left = "Super+Shift+Left"       # move the tile left (or to the next monitor)
# move_tile_right = "Super+Shift+Right"     # move the tile right
# move_tile_up = "Super+Shift+Up"           # move the tile up
# move_tile_down = "Super+Shift+Down"       # move the tile down
# workspace_prev = "Super+Alt+Left"         # previous workspace
# workspace_next = "Super+Alt+Right"        # next workspace
# workspace_prev_carry = "Super+Alt+Shift+Left"   # previous workspace, with the window
# workspace_next_carry = "Super+Alt+Shift+Right"  # next workspace, with the window
# Your own keys run a command:
# [[shortcuts.custom]]
# keys = "Super+B"
# command = "firefox --private-window"
