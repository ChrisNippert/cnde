# Pushing a tag like v0.1.0-beta1 builds cnde's pacman packages on Arch
# (packaging/arch/PKGBUILD, at the tag's version) and publishes them:
#
# - To a GitHub release for the tag: cnde-<version>-x86_64.tar.zst (files
#   laid out under usr/ and etc/, as installed) and its .sha256. The AUR's
#   cnde-bin installs from that tarball.
# - To the pacman repository, a release named "repo": the signed packages
#   and the signed cnde.db (see packaging/README.md for the pacman.conf
#   lines). Its old packages are replaced.
#
# Signing needs repository secrets: REPO_GPG_KEY (an armored private key,
# kept only for this), REPO_GPG_KEY_ID (its fingerprint) and, if the key has
# a passphrase, REPO_GPG_PASSPHRASE. Without the first two the repo step is
# skipped.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_KEY: ${{ secrets.REPO_GPG_KEY != '' }}
    steps:
      - name: Install build dependencies
        run: >
          pacman -Syu --noconfirm --needed
          git rust github-cli ttf-dejavu libdrm libinput libxkbcommon mesa pam seatd systemd-libs

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # makepkg won't run as root.
      - name: Set up a build user
        run: |
          useradd -m builder
          # Fat LTO links use a lot of memory; one at a time fits the runner.
          install -d -o builder -g builder /home/builder/.cargo
          printf '[build]\njobs = 1\n' > /home/builder/.cargo/config.toml
          chown builder: /home/builder/.cargo/config.toml
          chown -R builder: .
          sudo -u builder git config --global --add safe.directory '*'
          git config --global --add safe.directory '*'

      # CI has no terminal to ask for a passphrase on, so gpg reads it from a
      # file (REPO_GPG_PASSPHRASE, empty for a key without one). repo-add
      # runs gpg itself and picks this up too.
      - name: Import the signing key
        if: env.HAS_KEY == 'true'
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          KEY: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          gnupg=/home/builder/.gnupg
          install -d -m 700 -o builder -g builder "$gnupg"
          printf '%s' "$REPO_GPG_PASSPHRASE" > "$gnupg/passphrase"
          printf 'allow-loopback-pinentry\n' > "$gnupg/gpg-agent.conf"
          printf 'batch\npinentry-mode loopback\npassphrase-file %s/passphrase\n' "$gnupg" \
              > "$gnupg/gpg.conf"
          chown builder: "$gnupg"/passphrase "$gnupg"/gpg-agent.conf "$gnupg"/gpg.conf
          chmod 600 "$gnupg"/passphrase
          printf '%s\n' "$REPO_GPG_KEY" | sudo -u builder gpg --batch --import
          # Fail now, not after the hour-long build, if the key can't sign.
          echo test | sudo -u builder gpg --local-user "$KEY" --detach-sign -o /dev/null

      # The tag's version (v0.1.0-beta1 is 0.1.0beta1, which pacman sorts
      # before 0.1.0), in place of the checkout's pkgver().
      - name: Build the packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          # On a branch, so makepkg's clone of the checkout has the tag's commit.
          git checkout -B release
          sed -i \
              -e "s/^pkgver=.*/pkgver=${version//-/}/" \
              -e 's/^pkgbase=.*/pkgbase=cnde/' \
              -e 's/^pkgver() {/_checkout_pkgver() {/' \
              packaging/arch/PKGBUILD
          cd packaging/arch
          sudo -u builder makepkg --noconfirm --nodeps
          cd src/cnde
          sudo -u builder cargo test --release --frozen --workspace

      - name: Package the tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="cnde-$version-x86_64"
          root="dist/$name"
          built=packaging/arch/src/cnde
          for bin in cnde-compositor cnde-share-picker cnde-shell cnde-settings \
              cnde-lock cnde-files cnde-files-portal; do
              install -Dm755 "$built/target/release/$bin" -t "$root/usr/bin"
          done
          install -Dm644 data/cnde.desktop -t "$root/usr/share/wayland-sessions"
          install -Dm644 data/cnde-settings.desktop files/cnde-files.desktop \
              -t "$root/usr/share/applications"
          install -Dm644 data/cnde.portal -t "$root/usr/share/xdg-desktop-portal/portals"
          install -Dm644 data/org.freedesktop.impl.portal.desktop.cnde.service \
              -t "$root/usr/share/dbus-1/services"
          install -Dm644 data/pam.d/cnde-lock -t "$root/etc/pam.d"
          install -Dm644 LICENSE -t "$root/usr/share/licenses/cnde"
          install -dm755 "$root/usr/share/icons"
          cp -r icons/cnde "$root/usr/share/icons/cnde"
          tar --zstd -cf "dist/$name.tar.zst" -C dist "$name"
          (cd dist && sha256sum "$name.tar.zst" > "$name.tar.zst.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.zst
            dist/*.sha256

      # GitHub can't hold the symlinks repo-add makes, so cnde.db and
      # cnde.files go up as copies.
      - name: Publish the pacman repository
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.REPO_GPG_KEY_ID }}
        run: |
          mkdir repo
          cp packaging/arch/*.pkg.tar.zst repo/
          chown -R builder: repo
          cd repo
          for pkg in *.pkg.tar.zst; do
              sudo -u builder gpg --batch --yes --detach-sign --local-user "$KEY" "$pkg"
          done
          sudo -u builder repo-add --sign --key "$KEY" cnde.db.tar.zst *.pkg.tar.zst
          for link in cnde.db cnde.db.sig cnde.files cnde.files.sig; do
              cp --remove-destination "$(readlink -f "$link")" "$link"
          done
          gh release view repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
              gh release create repo --repo "$GITHUB_REPOSITORY" --latest=false \
                  --title "pacman repository" \
                  --notes "cnde's pacman repository. See packaging/README.md to add it."
          # Old packages out, then the new ones and the database in.
          gh release view repo --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while read -r asset; do
                  case "$asset" in
                      *.pkg.tar.zst | *.pkg.tar.zst.sig)
                          [ -e "$asset" ] ||
                              gh release delete-asset repo "$asset" --repo "$GITHUB_REPOSITORY" -y ;;
                  esac
              done
          gh release upload repo --repo "$GITHUB_REPOSITORY" --clobber \
              *.pkg.tar.zst *.pkg.tar.zst.sig \
              cnde.db cnde.db.sig cnde.files cnde.files.sig
